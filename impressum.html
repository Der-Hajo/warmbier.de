<style>
@font-face{font-family:'Archivo';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/Archivo-Regular.woff') format('woff')}
@font-face{font-family:'Archivo';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/Archivo-Medium.woff') format('woff')}
@font-face{font-family:'Archivo';font-weight:800;font-style:normal;font-display:swap;src:url('/fonts/Archivo-ExtraBold.woff') format('woff')}
@font-face{font-family:'Archivo';font-weight:900;font-style:normal;font-display:swap;src:url('/fonts/Archivo-Black.woff') format('woff')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/JetBrainsMono-Regular.woff') format('woff')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/JetBrainsMono-Medium.woff') format('woff')}
  :root{--bg:#0D0D0D;--line:#2A2A2A;--text:#F2F2F0;--muted:#9A9A96;--soft:#C4C4C0;--accent:#D7FF3A;
    --sans:'Archivo','Arial Black',Arial,sans-serif;--mono:'JetBrains Mono',Consolas,'Courier New',monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px}
  a{color:var(--text)}
  a:hover,a:focus-visible{color:var(--accent)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid var(--line)}
  header .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center;padding-top:24px;padding-bottom:24px}
  header a{text-decoration:none;letter-spacing:.12em;padding:10px 0}
  .prose{max-width:760px;padding-top:56px;padding-bottom:72px;font-family:var(--sans);font-size:17px;line-height:1.65;color:var(--soft)}
  h1{margin:0 0 28px;font-weight:900;font-size:clamp(40px,8vw,72px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase;color:var(--text)}
  h2{margin:40px 0 12px;font-weight:800;font-size:22px;text-transform:uppercase;color:var(--text)}
  p{margin:0 0 16px}
  footer{border-top:1px solid var(--line);color:var(--muted)}
  footer .wrap{display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between;padding-top:24px;padding-bottom:24px}
  footer a{color:var(--muted);text-decoration:none;padding:8px 0}
  footer a:hover{color:var(--accent)}
  .legal{display:flex;gap:24px}
</style>
</head>
